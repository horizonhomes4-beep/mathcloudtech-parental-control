<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · ParentGuard</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell"><div class="top"><h1>🛡️ ParentGuard Admin</h1><div id="who"></div></div><div id="app"><div class="c">Connecting to Firebase…</div></div></main>
<script type="module">
import {auth,db,A,F,panel,J,esc,online,parentsOf,fbcfg} from './common.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,createUserWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
const appEl=document.getElementById('app'),who=document.getElementById('who');
const secondaryAuth=getAuth(initializeApp(fbcfg,'parent-account-creator'));
const rnd=()=>Array.from(crypto.getRandomValues(new Uint8Array(24))).map(x=>x.toString(16).padStart(2,'0')).join('');
const NONE='__none';
function showLogin(note=''){
 who.innerHTML='';
 appEl.innerHTML=`<section class="c login"><h2>Administrator sign in</h2>${note?`<p class="off">${esc(note)}</p>`:''}<label for="e">Email address</label><input id="e" type="email" autocomplete="username"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password"><button id="go">Sign in</button><p id="msg" role="status"></p><p><a href="setup.html">First-time administrator setup</a> · <a href="index.html">Home</a></p></section>`;
 const e=document.getElementById('e'),p=document.getElementById('p'),b=document.getElementById('go'),m=document.getElementById('msg');
 const go=async()=>{b.disabled=true;m.textContent='Signing in…';try{await A.signInWithEmailAndPassword(auth,e.value.trim(),p.value)}catch(x){m.className='off';m.textContent=x.code||x.message;b.disabled=false}};
 b.onclick=go;p.addEventListener('keydown',x=>{if(x.key==='Enter')go()});
}
let unsubP=null,unsubD=null;const stop=()=>{unsubP&&unsubP();unsubD&&unsubD();unsubP=unsubD=null};
A.onAuthStateChanged(auth,async user=>{
 stop();
 if(!user||user.isAnonymous){showLogin();return;}
 appEl.innerHTML='<div class="c">Checking administrator access…</div>';
 try{const s=await F.getDoc(F.doc(db,'admins',user.uid));if(!s.exists()){await A.signOut(auth);showLogin('This account is not a ParentGuard administrator.');return;}}
 catch(e){showLogin('Could not verify administrator access: '+(e.code||e.message));return;}
 who.innerHTML=`<small>${esc(user.email||'')}</small> <button id="out" class="gr">Sign out</button>`;document.getElementById('out').onclick=()=>A.signOut(auth);
 appEl.innerHTML=`<section class="c"><h2>1 · Choose a parent</h2><div class="row"><div class="combo"><input id="pq" placeholder="Search parents by name or email" autocomplete="off" aria-label="Search parents"><ul id="pl" hidden></ul></div><button id="newP" class="gr">+ New parent</button></div>
 <div id="newPbox" hidden><div class="row" style="margin-top:12px"><input id="pn" placeholder="Full name"><input id="pe" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Temporary password (8+ characters)"><button id="mkP">Create parent login</button></div><p id="pm" role="status"></p></div></section>
 <section class="c" id="kidsBox" hidden></section><div id="one"></div>`;
 const $=id=>document.getElementById(id);
 let parents=[],devices=[],selP=null,selK=null,panelEl=null,panelSig='',headSig='';
 const pLabel=p=>p.name||p.email||p.id;
 const kidsOf=pid=>devices.filter(d=>pid===NONE?!parentsOf(d.data()).length:parentsOf(d.data()).includes(pid));
 // searchable parent dropdown
 const pq=$('pq'),pl=$('pl');
 const drawList=()=>{const q=pq.value.trim().toLowerCase();const rows=[{id:NONE,name:'Unassigned children',email:devices.filter(d=>!parentsOf(d.data()).length).length+' child device(s)'},...parents].filter(p=>!q||(pLabel(p)+' '+(p.email||'')).toLowerCase().includes(q));
  pl.innerHTML=rows.map(p=>`<li data-id="${esc(p.id)}" class="${p.id===selP?'sel':''}"><b>${esc(pLabel(p))}</b><small>${esc(p.id===NONE?p.email:(p.email||'')+' · '+kidsOf(p.id).length+' child(ren)')}</small></li>`).join('')||'<li><small>No parents match.</small></li>';};
 pq.onfocus=()=>{pq.select();drawList();pl.hidden=false};pq.oninput=()=>{drawList();pl.hidden=false};
 pq.onblur=()=>setTimeout(()=>{pl.hidden=true;const p=parents.find(x=>x.id===selP);pq.value=selP===NONE?'Unassigned children':p?pLabel(p):''},150);
 pl.onmousedown=e=>{const li=e.target.closest('li[data-id]');if(!li)return;e.preventDefault();selP=li.dataset.id;selK=null;pl.hidden=true;pq.value=li.querySelector('b').textContent;pq.blur();drawKids();drawOne();};
 $('newP').onclick=()=>$('newPbox').hidden=!$('newPbox').hidden;
 $('mkP').onclick=async()=>{const name=$('pn').value.trim(),email=$('pe').value.trim().toLowerCase(),pw=$('pw').value,m=$('pm'),b=$('mkP');if(!name||!email||pw.length<8){m.className='off';m.textContent='Enter a name, an email and a password of at least 8 characters.';return;}
  b.disabled=true;m.className='';m.textContent='Creating…';try{const c=await createUserWithEmailAndPassword(secondaryAuth,email,pw);await F.setDoc(F.doc(db,'parents',c.user.uid),{uid:c.user.uid,name,email,accountType:'email-password',createdAt:new Date().toISOString()});await signOut(secondaryAuth);$('pn').value=$('pe').value=$('pw').value='';selP=c.user.uid;m.className='on';m.textContent='Parent created. They sign in at parent.html with this email and password.';}catch(e){m.className='off';m.textContent='Failed: '+(e.code||e.message);}finally{b.disabled=false}};
 // children of the selected parent
 function drawKids(){const box=$('kidsBox');if(!selP){box.hidden=true;return;}box.hidden=false;const ks=kidsOf(selP),p=parents.find(x=>x.id===selP);
  const others=devices.filter(d=>selP!==NONE&&!parentsOf(d.data()).includes(selP));
  box.innerHTML=`<h2>2 · ${selP===NONE?'Unassigned children':esc(pLabel(p||{}))+"'s children"}</h2><div class="kids">${ks.map(d=>{const x=d.data(),on=online(J(x.status));return `<button class="kid ${d.id===selK?'act':''}" data-k="${d.id}"><span class="av">${esc((x.name||'?')[0].toUpperCase())}<i class="${on?'on':''}"></i></span><span>${esc(x.name||'Child')}<small>${x.suspended?'Suspended':on?'Online':'Offline'}</small></span></button>`}).join('')||'<span class="muted">No children yet.</span>'}</div>
  <div class="row" style="margin-top:14px"><input id="kn" placeholder="New child's name"><button id="addK">+ Add child</button>${others.length?`<select id="link"><option value="">Link existing child…</option>${others.map(d=>`<option value="${d.id}">${esc(d.data().name||d.id)}</option>`).join('')}</select>`:''}</div><div id="kcred"></div>`;
  box.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{selK=b.dataset.k;drawKids();drawOne();});
  $('addK').onclick=async()=>{const name=$('kn').value.trim();if(!name)return;const b=$('addK');b.disabled=true;try{const ids=selP===NONE?[]:[selP];const ref=await F.addDoc(F.collection(db,'devices'),{name,parentIds:ids,parentId:ids[0]||'',suspended:false,cfg:'{}',adminCfg:'{}',status:'{}',createdAt:new Date().toISOString()});await F.setDoc(F.doc(db,'deviceKeys',ref.id),{key:rnd()});selK=ref.id;}catch(e){$('kcred').textContent='Could not add child: '+(e.code||e.message);}finally{b.disabled=false}};
  const lk=$('link');if(lk)lk.onchange=()=>{if(lk.value)linkParent(lk.value,selP,true);};}
 const setParents=(doc,ids)=>F.updateDoc(doc.ref,{parentIds:ids,parentId:ids[0]||''});
 const linkParent=(devId,pid,add)=>{const doc=devices.find(d=>d.id===devId),cur=parentsOf(doc.data());return setParents(doc,add?[...new Set([...cur,pid])]:cur.filter(x=>x!==pid));};
 const creds=async(id,box)=>{const snap=await F.getDoc(F.doc(db,'deviceKeys',id));const v=JSON.stringify({projectId:fbcfg.projectId,apiKey:fbcfg.apiKey,deviceId:id,deviceKey:snap.data()?.key||''},null,2);
  try{await navigator.clipboard.writeText(v);box.innerHTML='<p class="on">config.json copied. Save it as agent/config.json on the child PC, then run install.bat as administrator.</p>';}catch{box.innerHTML='<p>Copy this into agent/config.json on the child PC:</p>';}
  const ta=document.createElement('textarea');ta.rows=6;ta.readOnly=true;ta.value=v;box.append(ta);};
 // the one selected child
 function drawOne(){const out=$('one');
  const doc=devices.find(d=>d.id===selK);if(!doc){out.innerHTML=selP?'<div class="c empty">Choose a child above to open their dashboard.</div>':'';panelEl=null;panelSig=headSig='';return;}
  const data=doc.data(),ids=parentsOf(data),hs=JSON.stringify([doc.id,data.name,data.suspended,ids,parents.map(p=>[p.id,p.name])]);
  if(hs!==headSig||!panelEl){headSig=hs;out.innerHTML=`<section class="c"><div class="row"><h2 style="margin:0;flex:1">${esc(data.name||'Child')} ${data.suspended?'<span class="tag bad">Suspended</span>':''}</h2></div>
   <div class="mgmt" style="margin:12px 0"><button id="ed" class="gr">✏️ Edit name</button><button id="sp" class="${data.suspended?'ok':'wn'}">${data.suspended?'▶ Reactivate':'⏸ Suspend'}</button><button id="cp" class="gr">📋 Copy config.json</button><button id="rk" class="gr">🔑 New device key</button><button id="dl" class="dg">🗑 Delete child</button></div><div id="cbox"></div>
   <div class="sec"><b>Parents who can see this child</b></div><div class="chips">${ids.map(i=>{const p=parents.find(x=>x.id===i);return `<span class="chip">${esc(p?pLabel(p):i)}<button data-rp="${esc(i)}" aria-label="Remove parent">×</button></span>`}).join('')||'<small>No parents linked</small>'}
   <select id="ap"><option value="">+ Add parent (Father, Mother, Uncle…)</option>${parents.filter(p=>!ids.includes(p.id)).map(p=>`<option value="${esc(p.id)}">${esc(pLabel(p))}</option>`).join('')}</select></div></section><div id="pnl"></div>`;
   $('ed').onclick=async()=>{const n=prompt('Child name',data.name||'');if(n?.trim())await F.updateDoc(doc.ref,{name:n.trim()});};
   $('sp').onclick=async()=>{const s=!data.suspended;if(s&&!confirm('Suspend this child? Their device will be locked until you reactivate.'))return;const cfg=J(data.cfg);await F.updateDoc(doc.ref,{suspended:s,cfg:JSON.stringify({...cfg,paused:s?true:false,unlockedUntil:0}),adminCfg:JSON.stringify({...J(data.adminCfg),paused:s,unlockedUntil:0})});};
   $('cp').onclick=()=>creds(doc.id,$('cbox'));
   $('rk').onclick=async()=>{if(!confirm('Generate a new key? The installed agent disconnects until you copy the new config.json to the PC.'))return;await F.setDoc(F.doc(db,'deviceKeys',doc.id),{key:rnd()});const ag=await F.getDocs(F.collection(db,'devices',doc.id,'agents'));await Promise.all(ag.docs.map(x=>F.deleteDoc(x.ref)));creds(doc.id,$('cbox'));};
   $('dl').onclick=async()=>{if(!confirm('Delete '+(data.name||'this child')+' permanently, including the device key?'))return;const ag=await F.getDocs(F.collection(db,'devices',doc.id,'agents'));await Promise.all(ag.docs.map(x=>F.deleteDoc(x.ref)));await F.deleteDoc(F.doc(db,'deviceKeys',doc.id));await F.deleteDoc(doc.ref);selK=null;};
   out.querySelectorAll('[data-rp]').forEach(b=>b.onclick=()=>{if(confirm('Remove this parent from '+(data.name||'the child')+'?'))linkParent(doc.id,b.dataset.rp,false)});
   $('ap').onchange=e=>{if(e.target.value)linkParent(doc.id,e.target.value,true)};
   panelEl=panel(doc.id,data,'admin',(cfg,adminCfg)=>F.updateDoc(doc.ref,{cfg:JSON.stringify(cfg),adminCfg:JSON.stringify(adminCfg||{})}));$('pnl').append(panelEl);panelSig=JSON.stringify([data.adminCfg,data.cfg]);}
  else panelEl.refresh(data);}
 unsubP=F.onSnapshot(F.collection(db,'parents'),s=>{parents=s.docs.map(d=>({id:d.id,...d.data()}));drawKids();drawOne();},e=>{appEl.insertAdjacentHTML('afterbegin','<div class="c off">Parent list error: '+esc(e.code||e.message)+'</div>')});
 unsubD=F.onSnapshot(F.collection(db,'devices'),s=>{devices=s.docs;if(selK&&!devices.some(d=>d.id===selK))selK=null;drawKids();drawOne();},e=>{appEl.insertAdjacentHTML('afterbegin','<div class="c off">Device list error: '+esc(e.code||e.message)+'</div>')});
});
</script></body></html>
